name: tomalyze
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  change_app_package_name: ^1.5.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/app-icon.png
  branding: assets/icon/footer-splash.png
  branding_bottom_padding: 80
  android: true
  ios: true

  android_gravity: center
  ios_content_mode: scaleAspectFit

  android_12:
    image: assets/icon/app-icon.png
    branding: assets/icon/footer-splash.png
    branding_bottom_padding: 80
    color: "#ffffff"



flutter:
  uses-material-design: true
  assets:
    - assets/icon/
