name: tomalyze
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  flutter_svg: ^2.2.3
  camera: ^0.11.3
  awesome_snackbar_content: ^0.1.8
  permission_handler: ^11.0.0
  image_picker: ^1.2.1
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  google_sign_in: ^7.2.0
  provider: ^6.1.5+1
  path: ^1.9.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  change_app_package_name: ^1.5.0
  build_runner: 2.4.13
  hive_generator: ^2.0.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/app-icon.png
  branding: assets/icon/footer-splash.png
  branding_bottom_padding: 80
  android: true
  ios: true

  android_gravity: center
  ios_content_mode: scaleAspectFit

  android_12:
    image: assets/icon/app-icon.png
    branding: assets/icon/footer-splash.png
    branding_bottom_padding: 80
    color: "#ffffff"



flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/
  
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
